<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Locatrix ESP Viewer</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .leaflet-container {
            height: 100%;
            width: 100%;
            max-width: 100%;
            max-height: 100%;
        }

        #layer-select-wrapper {
            z-index: 1000;
            position: absolute;
            left: 16px;
            bottom: 16px;
            height: 16px;
        }
    </style>
    <!-- Dynamically build asset URLs from the token segment in the path (example: /{token}/viewer) -->
    <script>
        (function () {
            var parts = window.location.pathname.split('/');
            var token = parts.length > 1 && parts[1] ? parts[1] : null;

            var jsFile = 'index-Dhi4Jmoa.js';
            var cssFile = 'index-olEnZx09.css';
            var prefix = token ? '/' + token + '/viewer/assets/' : '/viewer/assets/';

            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = prefix + jsFile;
            document.head.appendChild(script);

            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = prefix + cssFile;
            document.head.appendChild(link);
        })();
    </script>
</head>
<body>
<div id="root" style="width: 100%; height: 100%;"></div>
</body>
</html>
